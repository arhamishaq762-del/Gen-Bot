<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — CmdForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="dash">
<div class="bg-glow"></div>
<nav class="nav">
  <div class="brand" id="brandHome" role="button" tabindex="0"><span class="brand-icon">⚡</span> CmdForge</div>
  <div class="nav-right">
    <span class="demo-pill hidden" id="demoPill">DEMO MODE</span>
    <div class="user-chip" id="userChip"></div>
    <button class="btn btn-ghost" id="logoutBtn">Logout</button>
  </div>
</nav>

<main class="dash-main" id="app">
  <!-- Server picker view -->
  <section id="viewServers" class="hidden">
    <h1 class="page-title">Your Servers</h1>
    <p class="page-sub">Servers where <strong>you have admin</strong>. You can't see anyone else's servers — and they can't see yours.</p>
    <div class="server-grid" id="serverGrid"></div>
  </section>

  <!-- Guild manage view -->
  <section id="viewGuild" class="hidden">
    <button class="btn btn-ghost back-btn" id="backBtn">← All servers</button>
    <div class="guild-head">
      <div class="guild-icon-lg" id="guildIcon"></div>
      <div>
        <h1 class="page-title" id="guildName"></h1>
        <div class="stats-row" id="guildStats"></div>
      </div>
      <button class="btn btn-primary" id="newCmdBtn">+ New Command</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="commands">⌨️ Commands</button>
      <button class="tab" data-tab="audit">📋 Audit Log</button>
      <button class="tab" data-tab="leaderboard">🏆 Message Leaderboard</button>
    </div>

    <div id="tabCommands"><div class="cmd-list" id="cmdList"></div></div>
    <div id="tabAudit" class="hidden"><div class="audit-list" id="auditList"></div></div>
    <div id="tabLeaderboard" class="hidden"><div class="lb-list" id="lbList"></div></div>
  </section>

  <div class="loader" id="loader"><div class="spinner"></div></div>
</main>

<!-- Command editor modal -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle">New Command</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <form id="cmdForm" class="modal-body">
      <div class="form-grid">
        <label class="field">
          <span>Command name <em>/</em></span>
          <input type="text" id="fName" maxlength="32" placeholder="ok" pattern="[a-z0-9_\-]{1,32}" required>
          <small>lowercase letters, numbers, - and _ only</small>
        </label>
        <label class="field">
          <span>Description</span>
          <input type="text" id="fDesc" maxlength="100" placeholder="Sends a cool message">
        </label>
      </div>

      <div class="seg-row">
        <span class="seg-label">Response type</span>
        <div class="seg" id="segType">
          <button type="button" data-v="text" class="on">💬 Text</button>
          <button type="button" data-v="embed">🖼️ Embed</button>
        </div>
      </div>

      <label class="field" id="rowText">
        <span>Response message</span>
        <textarea id="fText" maxlength="2000" rows="3" placeholder="Hey {user}, welcome to {server}!"></textarea>
        <small>Placeholders: <code>{user}</code> mention · <code>{username}</code> · <code>{server}</code></small>
      </label>

      <div id="rowEmbed" class="hidden">
        <div class="form-grid">
          <label class="field"><span>Embed title</span><input type="text" id="fETitle" maxlength="256" placeholder="Announcement"></label>
          <label class="field"><span>Embed color</span><input type="color" id="fEColor" value="#5865F2"></label>
        </div>
        <label class="field"><span>Embed description</span><textarea id="fEDesc" maxlength="4000" rows="3" placeholder="Rich text here… supports {user} and {server}"></textarea></label>
        <div class="form-grid">
          <label class="field"><span>Image URL (https)</span><input type="url" id="fEImg" maxlength="500" placeholder="https://…"></label>
          <label class="field"><span>Footer</span><input type="text" id="fEFooter" maxlength="2048" placeholder="Powered by CmdForge"></label>
        </div>
      </div>

      <div class="seg-row">
        <span class="seg-label">Send it…</span>
        <div class="seg" id="segDelivery">
          <button type="button" data-v="channel" class="on">📢 In chat (everyone)</button>
          <button type="button" data-v="ephemeral">👁️ In chat (only them)</button>
          <button type="button" data-v="dm">📬 To their DMs</button>
        </div>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>Who can use it</span>
          <select id="fRole"><option value="">@everyone</option></select>
        </label>
        <label class="field">
          <span>Cooldown (seconds, 0 = none)</span>
          <input type="number" id="fCooldown" min="0" max="86400" value="0">
        </label>
      </div>

      <fieldset class="req-box">
        <legend>🏆 Unlock requirements <small>(optional — users must meet these to run the command)</small></legend>
        <div class="form-grid">
          <label class="field">
            <span>Minimum messages sent</span>
            <input type="number" id="fMinMsg" min="0" max="1000000" value="0">
            <small>counted since the bot joined</small>
          </label>
          <label class="field">
            <span>Custom status must contain</span>
            <input type="text" id="fStatus" maxlength="128" placeholder="discord.gg/myserver">
            <small>checks the user's Discord custom status</small>
          </label>
        </div>
      </fieldset>

      <label class="check-row"><input type="checkbox" id="fEnabled" checked> Command enabled</label>

      <div class="form-error hidden" id="formError"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Command</button>
      </div>
    </form>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<script src="/js/dashboard.js"></script>
</body>
</html>
